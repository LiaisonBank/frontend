
name: Deploy Liaison Bank Frontend

on:
  push:
    branches:
      - akashpawar

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liaisonbank-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy frontend via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            echo "======================================"
            echo " Liaison Bank Frontend Deployment"
            echo "======================================"

            cd /root/frontend

            echo "1. Fetching latest source code..."
            git fetch origin akashpawar

            echo "2. Updating production source..."
            git reset --hard origin/akashpawar

            echo "3. Checking Node.js and npm..."
            node --version
            npm --version

            echo "4. Removing obsolete generated sitemap files..."
            rm -f public/sitemap.xml public/sitemap-0.xml

            echo "5. Installing dependencies from package-lock.json..."
            npm ci

            echo "6. Building Next.js application..."
            npm run build

            echo "7. Checking generated sitemap route..."
            if [ ! -f .next/server/app/sitemap.xml/route.js ] \
              && [ ! -f .next/server/app/sitemap.xml.body ]; then
              echo "WARNING: Sitemap build output was not found at the expected paths."
              echo "The HTTP sitemap check below will verify the actual endpoint."
            fi

            echo "8. Checking the built sitemap endpoint..."
            SITEMAP_FILE="$(mktemp)"
            trap 'rm -f "$SITEMAP_FILE"' EXIT

            if ! curl --fail --silent --show-error \
              --max-time 30 \
              http://127.0.0.1:3000/sitemap.xml \
              -o "$SITEMAP_FILE"; then
              echo "Could not check the sitemap on port 3000."
              echo "Confirm the production app port and PM2 configuration."
              exit 1
            fi

            if ! grep -q '<urlset' "$SITEMAP_FILE"; then
              echo "ERROR: Sitemap response does not contain a URL set."
              head -c 1000 "$SITEMAP_FILE"
              exit 1
            fi

            if grep -q '<sitemapindex' "$SITEMAP_FILE"; then
              echo "ERROR: Unexpected sitemap index returned."
              exit 1
            fi

            echo "9. Restarting the frontend..."
            pm2 restart frontend --update-env

            echo "10. Saving PM2 process configuration..."
            pm2 save

            echo "11. Checking public sitemap..."
            PUBLIC_SITEMAP="$(mktemp)"
            trap 'rm -f "$SITEMAP_FILE" "$PUBLIC_SITEMAP"' EXIT

            if ! curl --fail --silent --show-error \
              --location \
              --max-time 30 \
              https://www.liaisonbank.com/sitemap.xml \
              -o "$PUBLIC_SITEMAP"; then
              echo "ERROR: Public sitemap URL is not responding successfully."
              exit 1
            fi

            if ! grep -q '<urlset' "$PUBLIC_SITEMAP"; then
              echo "ERROR: Public sitemap does not contain a URL set."
              head -c 1000 "$PUBLIC_SITEMAP"
              exit 1
            fi

            if grep -q '<sitemapindex' "$PUBLIC_SITEMAP"; then
              echo "ERROR: Public sitemap is returning a sitemap index."
              exit 1
            fi

            echo "======================================"
            echo " Deployment completed successfully!"
            echo "======================================"
